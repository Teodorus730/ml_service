[project]
name = "kickstarter-service"
version = "0.2.0"
description = "ML Pro 1 sem"
requires-python=">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas==2.3.3",
    "scikit-learn==1.6.1",
    "joblib",
    "psycopg[binary]",
    "mlflow-skinny>=3.16,<4",
    "skops>=0.11",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=8",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
    "matplotlib",
    "dvc>=3.67.1",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kickstarter"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: database missing - set DATABASE_URL"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

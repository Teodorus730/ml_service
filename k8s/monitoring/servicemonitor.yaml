# Prometheus Operator находит сервисы с меткой app: kickstarter и раз в 15 секунд забирает /metrics с порта http
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kickstarter-service
  namespace: default
spec:
  selector:
    matchLabels:
      app: kickstarter
  endpoints:
    - port: http
      path: /metrics
      interval: 15s